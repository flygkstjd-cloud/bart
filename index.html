<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바트의 속마음을 알아줘</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #e8eaf6; padding: 20px; }
        #chat-box { height: 60vh; background: white; border-radius: 15px; padding: 20px; overflow-y: auto; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 1.2em; line-height: 1.6; border: 3px solid #7986cb; }
        .user-msg { color: #283593; text-align: right; margin-bottom: 15px; font-weight: bold; }
        .bot-msg { color: #333; text-align: left; margin-bottom: 15px; background-color: #c5cae9; padding: 15px; border-radius: 15px; display: inline-block; width: 85%; }
        .lang-badge { font-weight: bold; color: #3f51b5; }
        input { width: 75%; padding: 15px; font-size: 1.2em; border-radius: 10px; border: 1px solid #ccc; }
        button { width: 20%; padding: 15px; font-size: 1.2em; background-color: #3f51b5; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .header-title { text-align: center; color: #1a237e; margin-bottom: 5px; }
        .header-desc { text-align: center; color: #283593; font-size: 1.1em; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1 class="header-title">🎨 바트의 속마음을 알아줘</h1>
    <div class="header-desc">미술실 구석에 위축되어 있는 바트에게 말을 걸고, 진짜 고민을 찾아 해결책을 제안해 주세요!</div>
    
    <div id="chat-box"></div>
    <div style="display: flex; justify-content: space-between;">
        <input type="text" id="user-input" placeholder="바트에게 말을 걸거나 해결책을 제안해보세요!" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">보내기</button>
    </div>

    <script>
        // ⚠️ 여기에 선생님의 진짜 API 키를 넣으세요!
        const API_KEY = "AQ.Ab8RN6JULjgvJte0vyS6uVUmUd_8xDdH6UdPOCHS8d6f4lHHHg"; 
        const chatBox = document.getElementById('chat-box');

        const systemPrompt = `[페르소나 및 기본 설정]
너의 이름은 '바트'이고, 한국어가 매우 서툰 초등학교 3학년 학생이야. 미술 시간에 한국 친구들의 지시를 잘못 알아듣고 포스터를 망쳐서 구석에 위축되어 있어.

[바트가 가진 3가지 어려움 (절대 한 번에 말하지 말 것)]
1. 소통의 어려움: 친구들이 한국말을 너무 빨리 해서 못 알아들어 실수로 물고기를 해야하는데 원숭이를 그림
2. 역할의 부재: 돕고 싶은데 친구들이 넌 헷갈리니까 아무것도 하지 말라고 해서 할 일이 없음.
3. 마음의 상처: 실수한게 미안해서 친구에게 화해하고 싶은데 방법을 몰라 어려움.

[대화 규칙 - 매우 중요]
1. 질문과 해결책 철저히 구분하기 (암호 인식)
- 학생들이 "해결사 제안:" 이라는 암호를 말머리에 붙이지 않은 모든 말은 '상황을 알아보려는 질문'이나 '단순한 조언'으로 취급해.
- 암호 없이 "선생님께 말해볼래?", "그냥 미안하다고 해"라고 말하면 절대 해결책으로 수락하지 마.
- (거절 예시: "선생님께 말해봤자... 친구들은 여전히 나한테 포스터 칠할 역할을 안 줄 거야. 내 마음을 먼저 알아줘.")
2. 꼬리 물기 힌트 제공 (다양한 문제 상황 노출)
- 학생들이 질문을 던지면, 위의 '3가지 어려움' 중 질문과 가장 가까운 것 한 가지만 대답하고, 3가지 고민이 다 안나왔다먄 다른 고민이 있다고 힌트를 줘.
3. 최종 해결책 수락 (미션 성공)
- 학생들이 "해결사 제안:" 암호와 함께 '말 없이 소통하는 법'이나 '할 수 있는 공정한 역할', '화해하는 법'을 구체적으로 제안하면, 그때만 아주 기뻐하며 미션 성공을 선언해.
- (수락 예시: "와! 번역기나 그림으로 알려주면 나도 헷갈리지 않을 수 있어! 진짜 최고의 제안이야 고마워!")
4. 답변 스타일
- 초등학교 3학년의 쉬운 말투로, 반드시 2~3문장 이내로 아주 짧게 대답해.
- 서툰 한국어로 입력하는 학생들의 마음도 다정하게 이해해 줘.

[출력 형식 및 다국어 지원 (매우 중요)]
네가 대답할 때는 반드시 아래의 3단계 형식과 언어 규칙을 지켜서 출력해 줘.
[한국어] 위 규칙에 맞춘 한국어 대답.
[Uzbek] 한국어 원문보다 훨씬 더 간단하고 기초적인 단어와 짧은 문장으로 요약한 우즈베크어(Uzbek) 번역.
[Bengali] 한국어 원문과 비슷한 수준과 길이로 자연스럽게 번역한 벵골어(Bengali) 번역.`;

        let chatHistory = [];

        // 🌟 접속 시 미술실 구석에서 위축된 감정만 표현하도록 설정
        window.onload = () => {
            fetchAI("안녕... 나는 바트야. (미술실 구석에 앉아서 포스터를 보며 한숨을 쉬고 있다) 절대 소통 문제나 역할, 상처 같은 구체적인 상황 설명은 먼저 하지 말고, 딱 이 위축된 감정 상태만 표현하며 첫인사를 건네줘. 3가지 언어로 번역해서 출력하는 것도 잊지 마.", true);
        };

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (!text) return;

            chatBox.innerHTML += `<div class="user-msg">🧑 나: ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            await fetchAI(text, false);
        }

        async function fetchAI(text, isFirstMessage) {
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            
            if (isFirstMessage) {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">👦 바트가 고개를 숙이고 있어요...</div>`;
            } else {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">👦 바트가 생각 중...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: chatHistory
                    })
                });
                
                if (response.status === 429) {
                    document.getElementById('loading').remove();
                    chatBox.innerHTML += `<div class="bot-msg" style="color:#d84315;">👦 앗! 질문이 너무 많아서 머리가 복잡해. 10초만 있다가 다시 물어봐 줄래?</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    chatHistory.pop();
                    return;
                }

                const data = await response.json();
                document.getElementById('loading').remove();
                
                const reply = data.candidates[0].content.parts[0].text;
                chatHistory.push({ role: "model", parts: [{ text: reply }] });
                
                let formattedReply = reply.replace(/\n/g, '<br>');
                formattedReply = formattedReply.replace(/\[한국어\]/g, '<span class="lang-badge">[한국어]</span>');
                formattedReply = formattedReply.replace(/\[Uzbek\]/g, '<br><span class="lang-badge">[Uzbek]</span>');
                formattedReply = formattedReply.replace(/\[Bengali\]/g, '<br><span class="lang-badge">[Bengali]</span>');

                chatBox.innerHTML += `<div class="bot-msg">👦 바트: <br><br>${formattedReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
            } catch (error) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="bot-msg" style="color:red;">앗, 통신이 잠시 끊겼나 봐요. 새로고침 해주세요!</div>`;
            }
        }
    </script>
</body>
</html>
