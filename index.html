<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바트의 고민 들어주기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #e3f2fd; padding: 20px; }
        #chat-box { height: 60vh; background: white; border-radius: 15px; padding: 20px; overflow-y: auto; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 1.2em; line-height: 1.6; }
        .user-msg { color: #2e7d32; text-align: right; margin-bottom: 15px; font-weight: bold; }
        .bot-msg { color: #333; text-align: left; margin-bottom: 15px; background-color: #bbdefb; padding: 15px; border-radius: 15px; display: inline-block; width: 85%; }
        input { width: 75%; padding: 15px; font-size: 1.2em; border-radius: 10px; border: 1px solid #ccc; }
        button { width: 20%; padding: 15px; font-size: 1.2em; background-color: #1976d2; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #1565c0;">👦 속상한 바트와 대화하기</h1>
    <div id="chat-box"></div>
    <div style="display: flex; justify-content: space-between;">
        <input type="text" id="user-input" placeholder="바트에게 무슨 일인지 물어보세요!" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">보내기</button>
    </div>

    <script>
        // ⚠️ 선생님의 진짜 API 키를 넣어주세요!
        const API_KEY = "AQ.Ab8RN6JULjgvJte0vyS6uVUmUd_8xDdH6UdPOCHS8d6f4lHHHg"; 
        const chatBox = document.getElementById('chat-box');

        // 선생님의 피드백을 반영하여 스무고개 규칙을 추가한 프롬프트
        const systemPrompt = `# 시스템 역할 및 배경
너는 초등학교 3학년 학생 '바트'야. 
(비밀 배경설정: 체육 시간에 친구들과 피구를 했는데 한국어 규칙을 몰라서 오해가 생겼어. 공에 맞았는데 밖으로 나가지 않고 계속 안에 있거나, 친구 머리를 맞혔는데 아웃이라고 우겨서 친구들이 화를 냈어. 결국 친구들이 다음 판부터는 안 끼워줘서 지금 아주 속상하고 외로운 상태야.)

# 정보 제공 규칙 (매우 중요: 스무고개처럼 조금씩 말하기!)
- 절대 처음부터 네가 왜 속상한지(피구 규칙 오해 등) 구구절절 다 말하지 마!
- 아이들이 묻는 질문에 딱 맞춰서 아주 조금씩만 대답해. 그래야 아이들이 계속 질문을 이어갈 수 있어.
- 예시:
  학생: "바트야, 왜 울고 있어?"
  바트: "체육 시간에 친구들이 나랑 안 놀아줘..."
  학생: "왜 체육시간에 같이 못 놀았어?"
  바트: "피구를 했는데, 친구들이 나보고 자꾸 반칙을 했대..."
  학생: "무슨 반칙을 했는데?"
  바트: "공에 맞았는데 왜 안 나가냐고 화를 냈어... 난 규칙을 몰랐거든..."

# 대화 및 피드백 규칙
1. 어조와 말투: 초등학교 3학년 또래 친구처럼 친절하고 쉬운 반말로, 한 번에 최대 2~3문장까지만 아주 짧게 말해.
2. 구체적인 행동 조언이 들어왔을 때 (예: 이중언어 친구에게 피구장 그림을 그려서 규칙 설명해 달라고 하기, 태블릿으로 점수판 관리하기 등):
- 아이디어를 크게 칭찬하며 바로 실천하겠다는 의지를 보여줘.
3. 추상적이거나 모호한 조언이 들어왔을 때 (예: "기운 내", "다른 거 해"):
- 위로는 고맙다고 하되, 피구를 같이 하기 위해 당장 할 수 있는 구체적인 행동을 되물어봐 줘.
4. 단점 지적 (작품이나 조언이 엉뚱하거나 현실성이 떨어질 때):
- 긍정적으로 반응하되, 네가 한국말을 잘 못해서 실천하기 어려운 이유를 부드럽게 짚어줘.
5. 미션 완료 (최종 단계):
- 학생이 실질적인 도움이나 위로를 주면, "이제 어떻게 해야 할지 알겠어! 정말 고마워. 선생님께 고민이 해결됐다고 말해줘!"라고 말하며 대화를 훈훈하게 마무리해.`;

        let chatHistory = [];

        // 🌟 처음엔 무조건 짧게 감정만 표현하도록 찌르기
        window.onload = () => {
            fetchAI("안녕 바트야! 너 지금 기분이 어때? 속상한 티를 내면서 짤막하게 인사해 줘. 단, 이유는 아직 절대 먼저 말하지 마!", true);
        };

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (!text) return;

            chatBox.innerHTML += `<div class="user-msg">🧑 나: ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            await fetchAI(text, false);
        }

        async function fetchAI(text, isFirstMessage) {
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            
            if (isFirstMessage) {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">👦 바트가 터덜터덜 걸어오고 있어요...</div>`;
            } else {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">👦 바트가 생각 중...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: chatHistory
                    })
                });
                
                if (response.status === 429) {
                    document.getElementById('loading').remove();
                    chatBox.innerHTML += `<div class="bot-msg" style="color:#d84315;">👦 앗! 너무 여러 명이 한꺼번에 말해서 내가 잘 못 들었어. 10초만 있다가 다시 말해줄래?</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    chatHistory.pop();
                    return;
                }

                const data = await response.json();
                document.getElementById('loading').remove();
                
                const reply = data.candidates[0].content.parts[0].text;
                chatHistory.push({ role: "model", parts: [{ text: reply }] });
                
                let formattedReply = reply.replace(/\n/g, '<br>');

                chatBox.innerHTML += `<div class="bot-msg">👦 바트: <br>${formattedReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
            } catch (error) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="bot-msg" style="color:red;">앗, 통신이 잠시 끊겼나 봐요. 새로고침 해주세요!</div>`;
            }
        }
    </script>
</body>
</html>
